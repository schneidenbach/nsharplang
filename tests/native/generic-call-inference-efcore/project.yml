name: NSharpLang.GenericCallInferenceEfCore.Tests
version: 1.0.0
backend: il
outputType: library
targetFramework: net10.0

# The Entity Framework Core spellings the generic-call-inference project reproduces with BCL shapes:
# `DbSet<T>.FromSqlRaw(sql, args)` (inferred type argument, `params` tail),
# `services.AddDbContext<Db>(o => ...)` (written type argument, inline lambda) and
# `this.Set<Person>()` inside a `DbContext` subclass (inherited generic method).
#
# Npgsql is used as a relational provider so `ToQueryString()` exposes the SQL and parameters without
# opening a connection or depending on a local database server.
dependencies:
  - nuget: Npgsql.EntityFrameworkCore.PostgreSQL
    version: 10.0.2
  - nuget: Microsoft.Extensions.DependencyInjection
    version: 10.0.7
