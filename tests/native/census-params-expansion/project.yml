name: NSharpLang.CensusParamsExpansion.Tests
version: 1.0.0
backend: il
outputType: library
targetFramework: net10.0

# The two real shapes the expansion exists for, both pinned to the versions the language server
# itself uses: `LoggerExtensions`' `params object?[]` tail is what every handler's logging call
# carries, and `Container<T>`'s `params T[]` constructor is how every list-valued LSP payload and
# registration option is built.
dependencies:
  - nuget: OmniSharp.Extensions.LanguageServer
    version: 0.19.9
  - nuget: Microsoft.Extensions.Logging
    version: 9.0.0
  - nuget: Microsoft.Extensions.DependencyInjection
    version: 9.0.0
  - nuget: Serilog.Extensions.Logging.File
    version: 3.0.0
  - dll: ../../../src/NSharpLang.Cli/bin/Debug/net10.0/NSharpLang.Compiler.Core.dll
