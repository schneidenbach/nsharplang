name: NSharpLang.ExternalHiddenMembers.Tests
version: 1.0.0
backend: il
outputType: library
targetFramework: net10.0

# `DbContextOptionsBuilder<TContext>` redeclares its base class's `Options` with a different type,
# which is the shape a reflection-style `GetProperty(name)` refuses (GitHub #239). Both assemblies
# are declared so the fixture does not depend on a global package cache.
dependencies:
  - nuget: Microsoft.EntityFrameworkCore
    version: 10.0.5
  - nuget: Microsoft.EntityFrameworkCore.Abstractions
    version: 10.0.5
  - nuget: Microsoft.EntityFrameworkCore.InMemory
    version: 10.0.5
