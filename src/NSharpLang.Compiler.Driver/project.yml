name: NSharpLang.Compiler.Driver
backend: il
outputType: library
targetFramework: net10.0
# Driver carries its own estate (`*.tests.nl`); every build of it that does not pass
# `-p:NSharpExcludeTests=false` is product-only, which is what the projects above it reference.
excludeTests: true
dependencies:
  - project: ../NSharpLang.Compiler.Tooling/project.yml
  - nuget: Microsoft.Build.Framework
    version: 18.0.2
  - nuget: Microsoft.Build.Utilities.Core
    version: 18.0.2
  - nuget: Mono.Cecil
    version: 0.11.6
  - nuget: System.Reflection.MetadataLoadContext
    version: 10.0.5
