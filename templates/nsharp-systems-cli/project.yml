name: SystemsApp
version: 1.0.0
entry: Program.nl
backend: il
outputType: exe
targetFramework: net10.0

language:
  profile: systems
  asyncDefaultType: ValueTask
  systems:
    mode: strict
    # Console output is cold startup work; hot and boundary policy checks remain active.
    unknownExternalCalls: allow
    aotTarget: nativeaot
    stackBudgetBytes: 4096
    warmup:
      - Warmup
